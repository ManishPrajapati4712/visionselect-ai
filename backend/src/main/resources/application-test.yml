# Automated test runs (unit + integration/context-load tests).
#
# Points at a separate database by default so tests never touch a dev
# database's data. Testcontainers-managed Postgres is the likely future
# upgrade here once integration tests for real modules exist; not wired
# now since Phase 2B has no modules to test against yet beyond a context
# load check.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/visionselect_test}
    username: ${DB_USERNAME:visionselect_test}
    password: ${DB_PASSWORD:visionselect_test}
  jpa:
    show-sql: false
  flyway:
    baseline-on-migrate: true
    clean-disabled: false # test databases are disposable; safe to clean between runs

logging:
  level:
    root: WARN
    com.visionselect.backend: INFO

springdoc:
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173
  storage:
    local:
      # Isolated from dev's ./data/local-storage - test runs are disposable
      # and shouldn't read/write real dev-local files.
      base-directory: ${java.io.tmpdir:/tmp}/visionselect-test-storage
